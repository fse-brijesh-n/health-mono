<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare | Hospital Management Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #1565c0;
            --primary-dark: #0d47a1;
            --primary-light: #e3f2fd;
            --secondary: #00897b;
            --danger: #c62828;
            --success: #2e7d32;
            --warning: #f57f17;
            --purple: #6a1b9a;
            --bg: #f5f7fa;
            --sidebar-bg: #102a43;
            --sidebar-hover: #1a3650;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px rgba(0,0,0,0.05);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* ---------- LOGIN SCREEN ---------- */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d47a1 0%, #1565c0 100%);
        }
        .login-box {
            background: #fff;
            padding: 40px 36px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-box h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: var(--text);
        }
        .login-box .subtitle {
            color: var(--text-secondary);
            margin-bottom: 28px;
            font-size: 0.85rem;
        }
        .login-box .form-group {
            margin-bottom: 18px;
        }
        .login-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.8rem;
            color: var(--text);
        }
        .login-box input {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: var(--transition);
        }
        .login-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(21,101,192,0.1);
        }
        .login-box .btn {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }
        .login-box .btn:hover {
            background: var(--primary-dark);
            box-shadow: 0 4px 12px rgba(21,101,192,0.35);
        }
        .login-error {
            color: var(--danger);
            font-size: 0.8rem;
            margin-top: 8px;
            display: none;
        }

        /* ---------- MAIN APP (hidden initially) ---------- */
        .app-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }
        .hidden {
            display: none !important;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 100;
            box-shadow: 2px 0 16px rgba(0,0,0,0.08);
        }
        .sidebar-logo {
            padding: 22px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            cursor: pointer;
        }
        .logo-icon {
            width: 38px; height: 38px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
        }
        .sidebar-logo h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #fff;
        }
        .sidebar-logo h1 span { color: #90caf9; font-weight: 400; }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
        }
        .nav-section { margin-bottom: 8px; }
        .nav-section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            padding: 12px 12px 4px;
            font-weight: 600;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 2px;
            text-decoration: none;
        }
        .nav-item i { width: 20px; font-size: 1.1rem; text-align: center; }
        .nav-item:hover { background: var(--sidebar-hover); color: #fff; }
        .nav-item.active {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 10px rgba(21,101,192,0.3);
        }
        .badge {
            margin-left: auto;
            background: #ef4444;
            color: #fff;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* Main content */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 28px 32px;
            transition: var(--transition);
            min-width: 0;
        }
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .page-header .breadcrumb {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-bottom: 28px;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 16px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: var(--transition);
        }
        .stat-card:hover {
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transform: translateY(-2px);
            border-color: #e2e8f0;
        }
        .stat-icon {
            width: 48px; height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }
        .stat-icon i { color: #fff; }
        .stat-card .stat-info h3 {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .stat-card .stat-info p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .card-header h3 { font-size: 1rem; font-weight: 600; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }
        thead th {
            background: #f8fafc;
            padding: 11px 14px;
            text-align: left;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }
        tbody td {
            padding: 11px 14px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: middle;
        }
        tbody tr:hover { background: #f8fafc; }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 600;
            display: inline-block;
        }
        .status-paid { background: #d1fae5; color: #065f46; }
        .status-unpaid { background: #fee2e2; color: #991b1b; }
        .status-confirmed { background: #dbeafe; color: #1e40af; }
        .status-cancelled { background: #fef3c7; color: #92400e; }

        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.82rem;
            letter-spacing: 0.2px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-dark); box-shadow: 0 4px 12px rgba(21,101,192,0.25); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { background: #1b5e20; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #b71c1c; }
        .btn-outline {
            background: #fff;
            border: 2px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: #f8fafc; }
        .btn-xs { padding: 4px 10px; font-size: 0.7rem; border-radius: 5px; }
        .btn-sm { padding: 6px 12px; font-size: 0.78rem; }

        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: var(--text);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: var(--transition);
            background: #fafbfc;
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(21,101,192,0.08);
            background: #fff;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.6);
            backdrop-filter: blur(3px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        .modal {
            background: #fff;
            border-radius: var(--radius);
            padding: 28px 30px;
            width: 90%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            animation: slideUp 0.25s ease;
            max-height: 85vh;
            overflow-y: auto;
        }
        @keyframes slideUp { from { transform:translateY(30px); opacity:0; } to { transform:translateY(0); opacity:1; } }
        .modal h3 { font-size: 1.2rem; margin-bottom: 18px; font-weight: 700; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

        .toast-container {
            position: fixed;
            top: 20px; right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            padding: 14px 20px;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 0.82rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            animation: slideInRight 0.3s ease, fadeOutRight 0.3s ease 2.7s forwards;
            max-width: 400px;
        }
        .toast-success { background: #2e7d32; }
        .toast-error { background: #c62828; }
        .toast-info { background: #1565c0; }
        @keyframes slideInRight { from { transform:translateX(120%); opacity:0; } to { transform:translateX(0); opacity:1; } }
        @keyframes fadeOutRight { from { transform:translateX(0); opacity:1; } to { transform:translateX(120%); opacity:0; } }

        .empty-state { text-align: center; padding: 40px; color: var(--text-secondary); }
        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 600;
            background: #e2e8f0;
            margin: 2px;
        }
        .loading { text-align: center; padding: 20px; color: var(--text-secondary); }

        @media (max-width: 900px) {
            .sidebar { width: 70px; }
            .sidebar-logo h1, .nav-section-title, .nav-item span:not(.fa), .badge { display: none; }
            .sidebar-logo { justify-content: center; }
            .nav-item { justify-content: center; padding: 12px; }
            .main-content { margin-left: 70px; }
        }
        @media (max-width: 500px) {
            .sidebar { width: 0; overflow: hidden; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h2>MediCare Portal</h2>
            <p class="subtitle">Sign in to your account</p>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" value="admin@healthcare.com" placeholder="admin@healthcare.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" value="admin" placeholder="Enter password">
            </div>
            <button class="btn" id="login-btn">Sign In</button>
            <p class="login-error" id="login-error">Invalid credentials</p>
        </div>
    </div>

    <!-- MAIN APPLICATION (hidden initially) -->
    <div id="app-container" class="app-container hidden">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-logo" onclick="navigateTo('dashboard')">
                <div class="logo-icon"><i class="fas fa-plus"></i></div>
                <h1>Medi<span>Care</span></h1>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Main</div>
                    <div class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')">
                        <i class="fas fa-th-large"></i> <span>Dashboard</span>
                    </div>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Management</div>
                    <div class="nav-item" data-page="patients" onclick="navigateTo('patients')">
                        <i class="fas fa-user-injured"></i> <span>Patients</span>
                    </div>
                    <div class="nav-item" data-page="doctors" onclick="navigateTo('doctors')">
                        <i class="fas fa-user-md"></i> <span>Doctors</span>
                    </div>
                    <div class="nav-item" data-page="appointments" onclick="navigateTo('appointments')">
                        <i class="fas fa-calendar-check"></i> <span>Appointments</span>
                        <span class="badge" id="appt-badge" style="display:none;">0</span>
                    </div>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Records</div>
                    <div class="nav-item" data-page="ehr" onclick="navigateTo('ehr')">
                        <i class="fas fa-notes-medical"></i> <span>EHR</span>
                    </div>
                    <div class="nav-item" data-page="prescriptions" onclick="navigateTo('prescriptions')">
                        <i class="fas fa-prescription"></i> <span>Prescriptions</span>
                    </div>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Finance</div>
                    <div class="nav-item" data-page="billing" onclick="navigateTo('billing')">
                        <i class="fas fa-file-invoice-dollar"></i> <span>Billing</span>
                    </div>
                    <div class="nav-item" data-page="insurance" onclick="navigateTo('insurance')">
                        <i class="fas fa-shield-alt"></i> <span>Insurance</span>
                    </div>
                </div>
                <div class="nav-section" style="margin-top:auto;">
                    <div class="nav-item" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
                    </div>
                </div>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content" id="main-content"></main>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toast-container"></div>

    <!-- MODAL OVERLAY -->
    <div class="modal-overlay" id="modal-overlay" style="display:none;">
        <div class="modal" id="modal-content"></div>
    </div>

    <script>
        (function() {
            // ---------- CONFIGURATION ----------
            const API_BASE_URL = 'http://localhost:8080'; // Set your real API base URL here

            // ---------- AUTH ----------
            const VALID_EMAIL = 'admin@healthcare.com';
            const VALID_PASSWORD = 'admin';
            let isAuthenticated = false;

            // ---------- UI HELPERS ----------
            function showToast(msg, type='info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.textContent = msg;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }

            function showLoading(container) {
                container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
            }

            // ---------- MODAL ----------
            function openModal(title, bodyHTML, onSave) {
                const overlay = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');
                content.innerHTML = `
                    <h3>${title}</h3>
                    <div>${bodyHTML}</div>
                    <div class="modal-actions">
                        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                        <button class="btn btn-primary" id="modal-save-btn">Save</button>
                    </div>
                `;
                overlay.style.display = 'flex';
                document.getElementById('modal-save-btn').addEventListener('click', () => {
                    if (onSave) onSave();
                    closeModal();
                });
            }
            window.closeModal = function() {
                document.getElementById('modal-overlay').style.display = 'none';
            };
            document.getElementById('modal-overlay').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            function confirmDelete(msg, onConfirm) {
                const overlay = document.getElementById('modal-overlay');
                const content = document.getElementById('modal-content');
                content.innerHTML = `
                    <h3><i class="fas fa-exclamation-triangle" style="color:#c62828;"></i> Confirm Delete</h3>
                    <p style="color:#64748b;">${msg}</p>
                    <div class="modal-actions">
                        <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                        <button class="btn btn-danger" id="modal-confirm-btn">Delete</button>
                    </div>
                `;
                overlay.style.display = 'flex';
                document.getElementById('modal-confirm-btn').addEventListener('click', () => {
                    if (onConfirm) onConfirm();
                    closeModal();
                });
            }

            // ---------- API CALLS ----------
            async function apiGet(endpoint) {
                const res = await fetch(`${API_BASE_URL}${endpoint}`);
                if (!res.ok) throw new Error(`GET ${endpoint} failed: ${res.status}`);
                return res.json();
            }

            async function apiPost(endpoint, data) {
                const res = await fetch(`${API_BASE_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!res.ok) throw new Error(`POST ${endpoint} failed: ${res.status}`);
                return res.json();
            }

            async function apiPut(endpoint, data) {
                const res = await fetch(`${API_BASE_URL}${endpoint}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (!res.ok) throw new Error(`PUT ${endpoint} failed: ${res.status}`);
                return res.json();
            }

            async function apiDelete(endpoint) {
                const res = await fetch(`${API_BASE_URL}${endpoint}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(`DELETE ${endpoint} failed: ${res.status}`);
            }

            // ---------- NAVIGATION ----------
            let currentPage = 'dashboard';
            window.navigateTo = function(page) {
                if (!isAuthenticated) return;
                currentPage = page;
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                const navItem = document.querySelector(`[data-page="${page}"]`);
                if (navItem) navItem.classList.add('active');
                renderPage(page);
            };

            function updateBadges() {
                if (!isAuthenticated) return;
                apiGet('/appointments').then(resp => {
                    const appointments = resp.data || [];
                    const pending = appointments.filter(a => a.status === 'confirmed').length;
                    const badge = document.getElementById('appt-badge');
                    if (pending > 0) { badge.style.display = 'inline'; badge.textContent = pending; }
                    else { badge.style.display = 'none'; }
                }).catch(() => {});
            }

            // ---------- RENDER ENGINE ----------
            function renderPage(page) {
                const container = document.getElementById('main-content');
                switch(page) {
                    case 'dashboard': renderDashboard(container); break;
                    case 'patients': renderPatients(container); break;
                    case 'doctors': renderDoctors(container); break;
                    case 'appointments': renderAppointments(container); break;
                    case 'ehr': renderEHR(container); break;
                    case 'prescriptions': renderPrescriptions(container); break;
                    case 'billing': renderBilling(container); break;
                    case 'insurance': renderInsurance(container); break;
                }
                updateBadges();
            }

            // ---------- DASHBOARD ----------
            function renderDashboard(container) {
                container.innerHTML = '<div class="page-header"><h2>Dashboard</h2></div><div class="stats-grid" id="stats-cards"></div>';
                Promise.all([
                    apiGet('/patients').catch(() => ({data:[]})),
                    apiGet('/doctors').catch(() => ({data:[]})),
                    apiGet('/appointments').catch(() => ({data:[]})),
                    apiGet('/billing').catch(() => ({data:[]})),
                    apiGet('/ehr').catch(() => ({data:[]})),
                    apiGet('/prescriptions').catch(() => ({data:[]}))
                ]).then(([patients, doctors, appointments, bills, ehr, prescriptions]) => {
                    const p = patients.data || [];
                    const d = doctors.data || [];
                    const a = appointments.data || [];
                    const b = bills.data || [];
                    const e = ehr.data || [];
                    const pr = prescriptions.data || [];
                    const pendingBills = b.filter(bill => bill.status === 'UNPAID').length;
                    const stats = [
                        { label:'Patients', count:p.length, icon:'fa-user-injured', color:'#1565c0', bg:'#e3f2fd', page:'patients' },

            // ---------- BOOK APPOINTMENT (shared between patients & appointments pages) ----------
            window.bookAppointmentForPatient = function(patientId = null) {
                Promise.all([apiGet('/patients'), apiGet('/doctors')]).then(([pResp, dResp]) => {
                    const patients = pResp.data || [];
                    const doctors = dResp.data || [];
                    const patientSelect = patientId
                        ? `<select id="apt-patient" disabled>
                            ${patients.map(p=>`<option value="${p.id}" ${p.id===patientId?'selected':''}>${p.name}</option>`).join('')}
                           </select>`
                        : `<select id="apt-patient">
                            ${patients.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
                           </select>`;
                    const body = `
                        <div class="form-group"><label>Patient</label>${patientSelect}</div>
                        <div class="form-group"><label>Doctor</label><select id="apt-doctor" onchange="updateSlotsHint()">
                            ${doctors.map(d=>`<option value="${d.id}">${d.name} - ${d.specialization}</option>`).join('')}
                        </select></div>
                        <div class="form-row">
                            <div class="form-group"><label>Date</label><input type="date" id="apt-date"></div>
                            <div class="form-group"><label>Time</label><input type="time" id="apt-time" step="60">
                            <small id="apt-slots-hint" style="color:#64748b;"></small></div>
                        </div>
                    `;
                    openModal('Book Appointment', body, async () => {
                        const selPatientId = parseInt(document.getElementById('apt-patient').value);
                        const doctorId = parseInt(document.getElementById('apt-doctor').value);
                        const date = document.getElementById('apt-date').value;
                        const time = document.getElementById('apt-time').value.substring(0,5);
                        if(!date || !time) { showToast('Date and time required','error'); return; }
                        try {
                            await apiPost('/appointments/book', { patientId: selPatientId, doctorId, date, time });
                            showToast('Appointment booked','success');
                            renderPage('appointments');
                        } catch(e) { showToast(e.message,'error'); }
                    });
                    window.updateSlotsHint = function() {
                        const docId = parseInt(document.getElementById('apt-doctor').value);
                        const doc = doctors.find(d=>d.id===docId);
                        const hint = document.getElementById('apt-slots-hint');
                        hint.textContent = doc ? 'Available slots: '+(doc.availableSlots||[]).join(', ') : '';
                    };
                    setTimeout(() => updateSlotsHint(), 50);
                }).catch(() => showToast('Failed to load data','error'));
            };

                                <td>${b.policyNumber||'N/A'}</td>
                                <td><span class="status-badge status-${b.status==='PAID'?'paid':'unpaid'}">${b.status}</span></td>
                                <td>${b.date}</td>
                                <td>${b.status==='UNPAID' ? `<button class="btn btn-success btn-xs" onclick="payBill(${b.id})"><i class="fas fa-check"></i> Pay</button>` : ''}
                                    <button class="btn btn-danger btn-xs" onclick="deleteBill(${b.id})"><i class="fas fa-trash"></i></button>
                                </td></tr>`).join('')}</tbody></table>`}
                        </div>
                    `;
                }).catch(() => showToast('Failed to load bills','error'));
            }
            window.showCreateBillModal = function() {
                apiGet('/patients').then(resp => {
                    const patients = resp.data || [];
                    const body = `
                        <div class="form-group"><label>Patient</label><select id="bill-patient">
                            ${patients.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
                        </select></div>
                        <div class="form-group"><label>Amount (₹)</label><input type="number" id="bill-amount" min="0" step="0.01"></div>
                    `;
                    openModal('Generate Bill', body, async () => {
                        const patientId = parseInt(document.getElementById('bill-patient').value);
                        const amount = parseFloat(document.getElementById('bill-amount').value);
                        if(!amount || amount<=0) { showToast('Valid amount required','error'); return; }
                        try {
                            await apiPost('/billing/create', { patientId, amount, policyNumber: '' });
                            showToast('Bill generated','success');
                            renderPage('billing');
                        } catch(e) { showToast(e.message,'error'); }
                    });
                });
            };
            window.payBill = function(id) {
                apiPut(`/billing/pay/${id}`, {}).then(() => {
                    showToast('Bill paid','success');
                    renderPage('billing');
                }).catch(e => showToast(e.message,'error'));
            };
            window.deleteBill = function(id) {
                confirmDelete('Delete this bill?', async () => {
                    try { await apiDelete(`/billing/${id}`); showToast('Deleted','info'); renderPage('billing'); }
                    catch(e) { showToast(e.message,'error'); }
                });
            };

            // ---------- INSURANCE ----------
            function renderInsurance(container) {
                container.innerHTML = `
                    <div class="page-header">
                        <div><h2>Insurance Validation</h2></div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>Validate Policy</h3></div>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="policy-input" placeholder="Enter policy number" style="padding:10px; border:2px solid #ccc; border-radius:8px; flex:1;">
                            <button class="btn btn-primary" onclick="validatePolicyUI()"><i class="fas fa-search"></i> Validate</button>
                        </div>
                        <div id="validation-result" style="margin-top:16px;"></div>
                    </div>
                `;
            }
            window.validatePolicyUI = function() {
                const policy = document.getElementById('policy-input').value.trim();
                const resultDiv = document.getElementById('validation-result');
                if(!policy) { resultDiv.innerHTML = '<p style="color:#c62828;">Enter a policy number.</p>'; return; }
                apiGet(`/insurance/validate/${policy}`).then(resp => {
                    const data = resp.data || resp;
                    if(data.valid) {
                        resultDiv.innerHTML = `<div style="background:#e8f5e9; padding:16px; border-radius:8px;"><i class="fas fa-check-circle" style="color:#2e7d32;"></i> <strong>Valid Policy</strong><br>Coverage: ₹${data.coverage||50000}</div>`;
                    } else {
                        resultDiv.innerHTML = `<div style="background:#ffebee; padding:16px; border-radius:8px;"><i class="fas fa-times-circle" style="color:#c62828;"></i> Invalid policy number.</div>`;
                    }
                }).catch(() => showToast('Validation failed','error'));
            };

            // ---------- LOGIN / LOGOUT ----------
            document.getElementById('login-btn').addEventListener('click', () => {
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value.trim();
                if (email === VALID_EMAIL && password === VALID_PASSWORD) {
                    isAuthenticated = true;
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app-container').classList.remove('hidden');
                    renderPage('dashboard');
                } else {
                    document.getElementById('login-error').style.display = 'block';
                }
            });

            window.logout = function() {
                isAuthenticated = false;
                document.getElementById('app-container').classList.add('hidden');
                document.getElementById('login-screen').classList.remove('hidden');
            };

        })();
    </script>
</body>
</html>
