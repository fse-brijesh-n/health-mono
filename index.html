
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>MediCare Pro - Hospital Management</title>
  <!-- Bootstrap 5 & Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #0ea5e9;
      --accent: #10b981;
      --danger: #ef4444;
      --light-bg: #f8fafc;
      --card-shadow: 0 4px 24px rgba(0,0,0,0.08);
      --transition: all 0.2s ease;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--light-bg);
      margin: 0;
      overflow-x: hidden;
    }
    .sidebar {
      background: linear-gradient(180deg, #0f172a 0%, #1e3a8a 100%);
      color: white;
      width: 260px;
      min-width: 260px;
      min-height: 100vh;
      position: fixed;
      z-index: 1030;
      left: 0;
      top: 0;
      box-shadow: 2px 0 12px rgba(0,0,0,0.15);
      transition: margin-left 0.3s ease;
    }
    .sidebar.collapsed {
      margin-left: -260px;
    }
    .sidebar .nav-link {
      color: rgba(255,255,255,0.8);
      padding: 12px 20px;
      border-radius: 8px;
      margin: 4px 12px;
      transition: var(--transition);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar .nav-link:hover, .sidebar .nav-link.active {
      background: rgba(255,255,255,0.15);
      color: white;
      transform: translateX(4px);
    }
    .sidebar .nav-link i {
      font-size: 1.2rem;
      width: 24px;
      text-align: center;
    }
    .main-content {
      margin-left: 260px;
      min-height: 100vh;
      background: var(--light-bg);
      transition: margin-left 0.3s ease;
    }
    .main-content.expanded {
      margin-left: 0;
    }
    .top-bar {
      background: white;
      box-shadow: 0 2px 12px rgba(0,0,0,0.04);
      border-radius: 0 0 16px 16px;
      padding: 12px 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-custom {
      background: white;
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      transition: var(--transition);
      border: none;
    }
    .card-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.1);
    }
    .stat-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--card-shadow);
      display: flex;
      align-items: center;
      gap: 18px;
      transition: var(--transition);
    }
    .stat-card:hover {
      transform: translateY(-3px);
    }
    .stat-icon {
      width: 55px;
      height: 55px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }
    .btn-primary-custom {
      background: var(--primary);
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 500;
      transition: var(--transition);
      color: white;
    }
    .btn-primary-custom:hover {
      background: #162b6e;
      transform: scale(1.02);
      color: white;
    }
    .btn-success-custom {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: white;
      padding: 10px 20px;
    }
    .btn-danger-custom {
      background: var(--danger);
      border: none;
      border-radius: 10px;
      color: white;
      padding: 10px 20px;
    }
    .badge-status {
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 500;
    }
    .table-responsive {
      border-radius: 12px;
      overflow-x: auto;
    }
    .form-control, .form-select {
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      padding: 10px 14px;
    }
    .modal-content {
      border-radius: 20px;
      border: none;
    }
    /* Overlay for mobile sidebar */
    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1025;
      display: none;
    }
    .sidebar-overlay.show {
      display: block;
    }
    @media (max-width: 768px) {
      .sidebar {
        margin-left: -260px;
      }
      .sidebar.mobile-show {
        margin-left: 0;
      }
      .main-content {
        margin-left: 0;
      }
      .main-content.expanded {
        margin-left: 0;
      }
    }
    .wizard-steps {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .wizard-steps .step {
      text-align: center;
      flex: 1;
      font-size: 0.85rem;
      position: relative;
    }
    .wizard-steps .step .circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e2e8f0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .wizard-steps .step.active .circle {
      background: var(--primary);
      color: white;
    }
    .wizard-steps .step.completed .circle {
      background: var(--accent);
      color: white;
    }
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <!-- Sidebar Overlay for mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="px-4 pt-4 pb-3 border-bottom border-white border-opacity-25">
      <h4 class="fw-bold text-white mb-0"><i class="bi bi-heart-pulse me-2"></i>MediCare Pro</h4>
      <small class="text-white-50">Admin Panel</small>
    </div>
    <div class="pt-3">
      <a href="#" class="nav-link active" data-page="dashboard" onclick="navigate('dashboard')"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="#" class="nav-link" data-page="patients" onclick="navigate('patients')"><i class="bi bi-people"></i> Patients</a>
      <a href="#" class="nav-link" data-page="doctors" onclick="navigate('doctors')"><i class="bi bi-heart-pulse"></i> Doctors</a>
      <a href="#" class="nav-link" data-page="appointments" onclick="navigate('appointments')"><i class="bi bi-calendar-check"></i> Appointments</a>
      <a href="#" class="nav-link" data-page="ehr" onclick="navigate('ehr')"><i class="bi bi-file-medical"></i> EHR</a>
      <a href="#" class="nav-link" data-page="prescriptions" onclick="navigate('prescriptions')"><i class="bi bi-capsule"></i> Prescriptions</a>
      <a href="#" class="nav-link" data-page="billing" onclick="navigate('billing')"><i class="bi bi-cash-stack"></i> Billing</a>
      <a href="#" class="nav-link" data-page="insurance" onclick="navigate('insurance')"><i class="bi bi-shield-check"></i> Insurance</a>
      <hr class="text-white-50 mx-3 my-2">
      <a href="#" class="nav-link text-danger-light" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-primary d-md-none" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
        <span class="fw-semibold fs-5 d-none d-sm-inline" id="pageTitle">Dashboard</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="text-secondary"><i class="bi bi-person-circle me-1"></i><span id="loggedUser">admin@healthcare.com</span></span>
      </div>
    </div>

    <!-- Page Content Container -->
    <div class="container-fluid p-3 p-md-4" id="pageContent">
      <!-- Dynamic content rendered here -->
    </div>
  </div>

  <!-- Toast container for notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Login Modal (shown if not logged in) -->
  <div class="modal fade" id="loginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-3">
        <div class="text-center mb-3">
          <i class="bi bi-heart-pulse fs-1 text-primary"></i>
          <h4 class="fw-bold mt-2">MediCare Pro</h4>
          <p class="text-secondary">Admin Login</p>
        </div>
        <div id="loginError" class="alert alert-danger d-none"></div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="admin@healthcare.com" value="admin@healthcare.com">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPassword" placeholder="Password" value="admin">
        </div>
        <button class="btn btn-primary-custom w-100 py-2" onclick="login()">Sign In</button>
      </div>
    </div>
  </div>

  <!-- Modals for forms will be created dynamically -->

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ============================
    // API Service Layer
    // ============================
    const API_BASE = 'http://localhost:8080';

    const API = {
      async request(method, path, body = null) {
        const url = `${API_BASE}${path}`;
        const options = {
          method: method,
          headers: { 'Content-Type': 'application/json' }
        };
        if (body) options.body = JSON.stringify(body);
        try {
          const res = await fetch(url, options);
          const json = await res.json();
          if (!res.ok || (json.status && json.status >= 400)) {
            throw new Error(json.message || `Request failed with status ${res.status}`);
          }
          // Extract data from ApiResponse wrapper
          return json.data !== undefined ? json.data : json;
        } catch (err) {
          showToast(err.message, 'danger');
          throw err;
        }
      },
      // Patient endpoints
      getPatients: () => API.request('GET', '/patients'),
      getPatient: (id) => API.request('GET', `/patients/${id}`),
      createPatient: (data) => API.request('POST', '/patients', data),
      updatePatient: (id, data) => API.request('PUT', `/patients/${id}`, data),
      deletePatient: (id) => API.request('DELETE', `/patients/${id}`),
      // Doctor endpoints
      getDoctors: () => API.request('GET', '/doctors'),
      getDoctor: (id) => API.request('GET', `/doctors/${id}`),
      getAvailableDoctors: (slot) => API.request('GET', `/doctors/available?slot=${slot}`),
      createDoctor: (data) => API.request('POST', '/doctors', data),
      updateDoctor: (id, data) => API.request('PUT', `/doctors/${id}`, data),
      deleteDoctor: (id) => API.request('DELETE', `/doctors/${id}`),
      // Appointment endpoints
      getAppointments: () => API.request('GET', '/appointments'),
      getAppointment: (id) => API.request('GET', `/appointments/${id}`),
      getAppointmentsByPatient: (patientId) => API.request('GET', `/appointments/patient/${patientId}`),
      getAppointmentsByDoctor: (doctorId) => API.request('GET', `/appointments/doctor/${doctorId}`),
      bookAppointment: (data) => API.request('POST', '/appointments/book', data),
      deleteAppointment: (id) => API.request('DELETE', `/appointments/${id}`),
      // EHR endpoints
      getEHRs: () => API.request('GET', '/ehr'),
      getEHR: (id) => API.request('GET', `/ehr/${id}`),
      getEHRsByPatient: (patientId) => API.request('GET', `/ehr/patient/${patientId}`),
      createEHR: (data) => API.request('POST', '/ehr', data),
      updateEHR: (id, data) => API.request('PUT', `/ehr/${id}`, data),
      deleteEHR: (id) => API.request('DELETE', `/ehr/${id}`),
      // Prescription endpoints
      getPrescriptions: () => API.request('GET', '/prescriptions'),
      getPrescription: (id) => API.request('GET', `/prescriptions/${id}`),
      getPrescriptionsByPatient: (patientId) => API.request('GET', `/prescriptions/patient/${patientId}`),
      createPrescription: (data) => API.request('POST', '/prescriptions', data),
      updatePrescription: (id, data) => API.request('PUT', `/prescriptions/${id}`, data),
      deletePrescription: (id) => API.request('DELETE', `/prescriptions/${id}`),
      // Billing endpoints
      getBillings: () => API.request('GET', '/billing'),
      getBilling: (id) => API.request('GET', `/billing/${id}`),
      getBillingsByPatient: (patientId) => API.request('GET', `/billing/patient/${patientId}`),
      createBilling: (data) => API.request('POST', '/billing/create', data),
      payBill: (id) => API.request('PUT', `/billing/pay/${id}`),
      deleteBilling: (id) => API.request('DELETE', `/billing/${id}`),
      // Insurance
      validateInsurance: (policyNumber) => API.request('GET', `/insurance/validate/${policyNumber}`),
    };

    // ============================
    // Toast Notification Helper
    // ============================
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toastId = 'toast-' + Date.now();
      const bgClass = type === 'success' ? 'bg-success' : type === 'danger' ? 'bg-danger' : 'bg-info';
      const html = `
        <div id="${toastId}" class="toast align-items-center text-white ${bgClass} border-0" role="alert">
          <div class="d-flex">
            <div class="toast-body">${message}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
          </div>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', html);
      const toastEl = document.getElementById(toastId);
      const bsToast = new bootstrap.Toast(toastEl, { delay: 3000 });
      bsToast.show();
      toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }

    // ============================
    // Authentication (Hardcoded)
    // ============================
    const VALID_EMAIL = 'admin@healthcare.com';
    const VALID_PASSWORD = 'admin';

    function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const errorDiv = document.getElementById('loginError');
      if (email === VALID_EMAIL && password === VALID_PASSWORD) {
        localStorage.setItem('medicare_loggedIn', 'true');
        const loginModal = bootstrap.Modal.getInstance(document.getElementById('loginModal'));
        loginModal.hide();
        document.getElementById('loggedUser').textContent = email;
        navigate('dashboard');
      } else {
        errorDiv.classList.remove('d-none');
        errorDiv.textContent = 'Invalid email or password. Use admin@healthcare.com / admin';
      }
    }

    function logout() {
      localStorage.removeItem('medicare_loggedIn');
      location.reload(); // force reload to show login again
    }

    // ============================
    // Sidebar Toggle
    // ============================
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      sidebar.classList.toggle('mobile-show');
      overlay.classList.toggle('show');
      // On desktop the sidebar uses collapsed class, but we rely on media queries for mobile
    }

    // ============================
    // Page Navigation
    // ============================
    let currentPage = 'dashboard';

    function navigate(page) {
      currentPage = page;
      document.getElementById('pageTitle').textContent = page.charAt(0).toUpperCase() + page.slice(1);
      // Update sidebar active link
      document.querySelectorAll('.sidebar .nav-link').forEach(link => link.classList.remove('active'));
      const activeLink = document.querySelector(`.sidebar .nav-link[data-page="${page}"]`);
      if (activeLink) activeLink.classList.add('active');
      // Close mobile sidebar if open
      if (window.innerWidth < 768) {
        document.getElementById('sidebar').classList.remove('mobile-show');
        document.getElementById('sidebarOverlay').classList.remove('show');
      }
      renderPage(page);
    }

    // ============================
    // Main Renderer
    // ============================
    async function renderPage(page) {
      const container = document.getElementById('pageContent');
      container.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div></div>`;
      try {
        switch (page) {
          case 'dashboard': container.innerHTML = await renderDashboard(); break;
          case 'patients': container.innerHTML = await renderPatients(); break;
          case 'doctors': container.innerHTML = await renderDoctors(); break;
          case 'appointments': container.innerHTML = await renderAppointments(); break;
          case 'ehr': container.innerHTML = await renderEHR(); break;
          case 'prescriptions': container.innerHTML = await renderPrescriptions(); break;
          case 'billing': container.innerHTML = await renderBilling(); break;
          case 'insurance': container.innerHTML = renderInsurance(); break;
          default: container.innerHTML = await renderDashboard();
        }
      } catch (err) {
        container.innerHTML = `<div class="alert alert-danger">Failed to load page: ${err.message}</div>`;
      }
    }

    // ============================
    // Dashboard
    // ============================
    async function renderDashboard() {
      const [patients, doctors, appointments, billings] = await Promise.all([
        API.getPatients().catch(() => []),
        API.getDoctors().catch(() => []),
        API.getAppointments().catch(() => []),
        API.getBillings().catch(() => [])
      ]);
      const totalPatients = patients.length;
      const totalDoctors = doctors.length;
      const today = new Date().toISOString().split('T')[0];
      const todayAppts = appointments.filter(a => a.date === today).length;
      const unpaidBills = billings.filter(b => b.status === 'UNPAID').length;
      // recent 5 appointments sorted by date desc
      const sortedAppts = [...appointments].sort((a,b) => b.date.localeCompare(a.date)).slice(0,5);
      const recentApptsHtml = sortedAppts.map(a => {
        const p = patients.find(p => p.id == a.patientId);
        const d = doctors.find(d => d.id == a.doctorId);
        return `<div class="d-flex justify-content-between border-bottom py-2"><span>${p?.name || 'N/A'}</span><small>${d?.name || 'N/A'} - ${a.date} ${a.time}</small></div>`;
      }).join('') || '<p class="text-muted">No recent appointments</p>';

      const unpaidHtml = billings.filter(b => b.status === 'UNPAID').slice(0,5).map(b => {
        const p = patients.find(p => p.id == b.patientId);
        return `<div class="d-flex justify-content-between border-bottom py-2"><span>${p?.name || 'N/A'}</span><span class="text-danger fw-bold">₹${b.amount}</span></div>`;
      }).join('') || '<p class="text-success">All bills paid!</p>';

      return `
        <div class="row g-3 mb-4">
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon bg-primary bg-opacity-10 text-primary"><i class="bi bi-people"></i></div>
              <div><h5 class="mb-0">${totalPatients}</h5><small class="text-secondary">Total Patients</small></div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon bg-info bg-opacity-10 text-info"><i class="bi bi-heart-pulse"></i></div>
              <div><h5 class="mb-0">${totalDoctors}</h5><small class="text-secondary">Doctors</small></div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon bg-success bg-opacity-10 text-success"><i class="bi bi-calendar-check"></i></div>
              <div><h5 class="mb-0">${todayAppts}</h5><small class="text-secondary">Today's Appointments</small></div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon bg-warning bg-opacity-10 text-warning"><i class="bi bi-cash"></i></div>
              <div><h5 class="mb-0">${unpaidBills}</h5><small class="text-secondary">Pending Bills</small></div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <div class="card-custom p-4">
              <h5 class="fw-semibold mb-3"><i class="bi bi-clock-history me-2"></i>Recent Appointments</h5>
              ${recentApptsHtml}
            </div>
          </div>
          <div class="col-md-6 mb-3">
            <div class="card-custom p-4">
              <h5 class="fw-semibold mb-3"><i class="bi bi-exclamation-triangle me-2"></i>Unpaid Bills</h5>
              ${unpaidHtml}
            </div>
          </div>
        </div>
        <div class="mt-3">
          <button class="btn btn-primary-custom" onclick="startWizard()"><i class="bi bi-plus-circle me-2"></i>New Appointment (Wizard)</button>
        </div>
      `;
    }

    // ============================
    // Patients Page
    // ============================
    async function renderPatients() {
      const patients = await API.getPatients().catch(() => []);
      return `
        <div class="card-custom p-3 p-md-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
            <h4 class="fw-semibold"><i class="bi bi-people me-2"></i>Patients</h4>
            <button class="btn btn-primary-custom" onclick="showPatientModal()"><i class="bi bi-plus-lg"></i> Add Patient</button>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light"><tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Policy No.</th><th>Actions</th></tr></thead>
              <tbody>${patients.map(p => `
                <tr>
                  <td>${p.id}</td><td>${p.name}</td><td>${p.phone}</td><td>${p.email}</td><td>${p.policyNumber}</td>
                  <td>
                    <button class="btn btn-sm btn-outline-secondary me-1" onclick="editPatient(${p.id})"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deletePatient(${p.id})"><i class="bi bi-trash"></i></button>
                  </td>
                </tr>`).join('')}</tbody>
            </table>
          </div>
        </div>
        <div class="modal fade" id="patientModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content p-3"><div id="patientFormInner"></div></div></div></div>
      `;
    }

    function showPatientModal(id = null) {
      const modal = new bootstrap.Modal(document.getElementById('patientModal'));
      const formInner = document.getElementById('patientFormInner');
      const patient = id ? patientsCache.find(p => p.id == id) : null;
      formInner.innerHTML = `
        <h5 class="mb-3">${patient ? 'Edit' : 'Add'} Patient</h5>
        <input type="hidden" id="patId" value="${patient?.id || ''}">
        <div class="mb-2"><input class="form-control" id="patName" placeholder="Name" value="${patient?.name || ''}"></div>
        <div class="mb-2"><input class="form-control" id="patPhone" placeholder="Phone" value="${patient?.phone || ''}"></div>
        <div class="mb-2"><input class="form-control" id="patEmail" placeholder="Email" value="${patient?.email || ''}"></div>
        <div class="mb-3"><input class="form-control" id="patPolicy" placeholder="Policy Number" value="${patient?.policyNumber || ''}"></div>
        <button class="btn btn-primary-custom w-100" onclick="savePatient()">Save</button>
      `;

    function renderWizardStep() {
      const steps = ['Patient', 'Doctor', 'Slot Check', 'Book Appt', 'Create EHR', 'Prescription', 'Bill', 'Insurance', 'Pay'];
      const stepHtml = steps.map((s, i) => {
        let cls = '';
        if (i < wizardCurrentStep) cls = 'completed';
        else if (i === wizardCurrentStep) cls = 'active';
        return `<div class="step ${cls}"><div class="circle">${i+1}</div><span>${s}</span></div>`;
      }).join('');
      const inner = document.getElementById('wizardInner');
      inner.innerHTML = `
        <div class="wizard-steps mb-4">${stepHtml}</div>
        <div id="wizardStepContent"></div>
      `;
      updateWizardContent();

            <select class="form-select mb-2" id="wizDoctorSelect"><option value="">-- Choose Doctor --</option>${doctors.map(d => `<option value="${d.id}">${d.name} (${d.specialization})</option>`).join('')}</select>

            <div id="quickDoctorForm" class="d-none">
              <input class="form-control mb-1" id="quickDocName" placeholder="Name">
              <input class="form-control mb-1" id="quickDocSpec" placeholder="Specialization">
              <input class="form-control mb-1" id="quickDocSlots" placeholder="Slots (comma separated)">
              <button class="btn btn-sm btn-primary-custom" onclick="saveQuickDoctor()">Save Doctor</button>
            </div>
            <button class="btn btn-primary-custom" onclick="nextWizardStep()">Next</button>
          `;
          break;
        case 2: // Slot availability check
          contentDiv.innerHTML = `
            <h5>Check Available Doctors by Slot</h5>
            <div class="mb-2"><input type="time" class="form-control" id="wizSlot" value="10:00"></div>
            <button class="btn btn-outline-primary mb-3" onclick="checkAvailability()">Check Availability</button>
            <div id="availResults"></div>
            <button class="btn btn-primary-custom mt-2" onclick="nextWizardStep()">Next</button>
          `;
          break;
        case 3: // Book Appointment
          contentDiv.innerHTML = `
            <h5>Book Appointment</h5>
            <div class="mb-2"><input type="date" class="form-control" id="wizDate" value="${new Date().toISOString().split('T')[0]}"></div>
            <div class="mb-2"><input type="time" class="form-control" id="wizTime" value="${wizardData.time || '10:00'}"></div>
            <button class="btn btn-primary-custom" onclick="bookAppointment()">Book</button>
          `;
          break;
        case 4: // Create EHR
          contentDiv.innerHTML = `
            <h5>Create EHR</h5>
            <input class="form-control mb-2" id="wizDiagnosis" placeholder="Diagnosis">
            <input class="form-control mb-2" id="wizTreatment" placeholder="Treatment">
            <button class="btn btn-primary-custom" onclick="createEHRStep()">Create EHR</button>
          `;
          break;
        case 5: // Prescription
          contentDiv.innerHTML = `
            <h5>Issue Prescription</h5>
            <input class="form-control mb-2" id="wizMeds" placeholder="Medicines">
            <input class="form-control mb-2" id="wizDosage" placeholder="Dosage">
            <input class="form-control mb-2" id="wizNotes" placeholder="Doctor Notes">
            <input type="date" class="form-control mb-2" id="wizPrescDate" value="${wizardData.apptDate || new Date().toISOString().split('T')[0]}">
            <button class="btn btn-primary-custom" onclick="createPrescriptionStep()">Create Prescription</button>
          `;
          break;
        case 6: // Billing
          contentDiv.innerHTML = `
            <h5>Generate Bill</h5>
            <input class="form-control mb-2" id="wizAmount" placeholder="Amount">
            <input class="form-control mb-2" id="wizPolicy" value="${wizardData.policyNumber || ''}" placeholder="Policy Number">
            <button class="btn btn-primary-custom" onclick="createBillingStep()">Create Bill</button>
          `;
          break;
        case 7: // Insurance Validation
          contentDiv.innerHTML = `
            <h5>Validate Insurance</h5>
            <p>Policy Number: <strong>${wizardData.policyNumber || 'N/A'}</strong></p>
            <button class="btn btn-primary-custom" onclick="validateInsuranceStep()">Validate</button>
            <div id="wizInsResult" class="mt-2"></div>
          `;
          break;
        case 8: // Pay Bill
          contentDiv.innerHTML = `
            <h5>Mark Bill as Paid</h5>
            <p>Bill ID: <strong>${wizardData.billId || 'N/A'}</strong></p>
            <button class="btn btn-success-custom" onclick="payBillStep()">Pay Bill</button>
            <div class="mt-3"><button class="btn btn-primary-custom" onclick="finishWizard()">Finish</button></div>
          `;
          break;
        default: break;
      }
    }

    async function nextWizardStep() {
      // Gather data from current step before moving
      if (wizardCurrentStep === 0) {
        const select = document.getElementById('wizPatientSelect');
        if (select && select.value) {
          wizardData.patientId = Number(select.value);
          const pat = await API.getPatient(wizardData.patientId);
          wizardData.policyNumber = pat.policyNumber;
        } else {
          return showToast('Please select or add a patient', 'danger');
        }
      } else if (wizardCurrentStep === 1) {
        const select = document.getElementById('wizDoctorSelect');
        if (select && select.value) {
          wizardData.doctorId = Number(select.value);
        } else {
          return showToast('Please select or add a doctor', 'danger');
        }
      } else if (wizardCurrentStep === 2) {
        const slot = document.getElementById('wizSlot')?.value;
        if (!slot) return showToast('Select a time slot', 'danger');
        wizardData.time = slot;
      }
      wizardCurrentStep++;
      renderWizardStep();
    }

    function quickAddPatient() {
      document.getElementById('quickPatientForm').classList.toggle('d-none');
    }
    async function saveQuickPatient() {
      const name = document.getElementById('quickPatName').value.trim();
      const phone = document.getElementById('quickPatPhone').value.trim();
      const email = document.getElementById('quickPatEmail').value.trim();
      const policyNumber = document.getElementById('quickPatPolicy').value.trim();
      if (!name || !email) return showToast('Name and email required', 'danger');
      try {
        const newPatient = await API.createPatient({ name, phone, email, policyNumber });
        showToast('Patient created', 'success');
        document.getElementById('quickPatientForm').classList.add('d-none');
        // Refresh patient select
        const select = document.getElementById('wizPatientSelect');
        const patients = await API.getPatients();
        select.innerHTML = '<option value="">-- Choose Patient --</option>' + patients.map(p => `<option value="${p.id}" ${p.id==newPatient.id?'selected':''}>${p.name} (${p.id})</option>`).join('');
      } catch (err) { showToast('Failed: '+err.message, 'danger'); }
    }

    function quickAddDoctor() {
      document.getElementById('quickDoctorForm').classList.toggle('d-none');
    }
    async function saveQuickDoctor() {
      const name = document.getElementById('quickDocName').value.trim();
      const specialization = document.getElementById('quickDocSpec').value.trim();
      const slots = document.getElementById('quickDocSlots').value.split(',').map(s=>s.trim()).filter(s=>s);
      if (!name || !specialization) return showToast('Name and specialization required', 'danger');
      try {
        const newDoc = await API.createDoctor({ name, specialization, availableSlots: slots });
        showToast('Doctor created', 'success');
        document.getElementById('quickDoctorForm').classList.add('d-none');
        const select = document.getElementById('wizDoctorSelect');
        const doctors = await API.getDoctors();
        select.innerHTML = '<option value="">-- Choose Doctor --</option>' + doctors.map(d => `<option value="${d.id}" ${d.id==newDoc.id?'selected':''}>${d.name} (${d.specialization})</option>`).join('');
      } catch (err) { showToast('Failed: '+err.message, 'danger'); }
    }

    async function checkAvailability() {
      const slot = document.getElementById('wizSlot').value;
      if (!slot) return;
      try {
        const availableDoctors = await API.getAvailableDoctors(slot);
        const div = document.getElementById('availResults');
        if (availableDoctors.length === 0) {
          div.innerHTML = '<div class="alert alert-warning">No doctors available at that slot</div>';
        } else {
          div.innerHTML = '<h6>Available Doctors:</h6>' + availableDoctors.map(d => `<div class="form-check"><input class="form-check-input" type="radio" name="availDoc" value="${d.id}" id="doc${d.id}"><label class="form-check-label" for="doc${d.id}">${d.name} (${d.specialization})</label></div>`).join('');
        }
      } catch (err) { showToast('Check failed: '+err.message, 'danger'); }
    }

    async function bookAppointment() {
      const date = document.getElementById('wizDate').value;
      const time = document.getElementById('wizTime').value;
      if (!date || !time) return showToast('Select date and time', 'danger');
      if (!wizardData.doctorId || !wizardData.patientId) return showToast('Patient/Doctor missing', 'danger');
      try {
        const appt = await API.bookAppointment({ patientId: wizardData.patientId, doctorId: wizardData.doctorId, date, time });
        wizardData.appointmentId = appt.id;
        wizardData.apptDate = date;
        showToast('Appointment booked', 'success');
        wizardCurrentStep++;
        renderWizardStep();
      } catch (err) { showToast('Booking failed: '+err.message, 'danger'); }
    }

    async function createEHRStep() {
      const diagnosis = document.getElementById('wizDiagnosis').value.trim();
      const treatment = document.getElementById('wizTreatment').value.trim();
      if (!diagnosis) return showToast('Diagnosis required', 'danger');
      try {
        const ehr = await API.createEHR({ patientId: wizardData.patientId, diagnosis, treatment, visitDate: wizardData.apptDate || new Date().toISOString().split('T')[0] });
        wizardData.ehrId = ehr.id;
        showToast('EHR created', 'success');
        wizardCurrentStep++;
        renderWizardStep();
      } catch (err) { showToast('Failed: '+err.message, 'danger'); }
    }

    async function createPrescriptionStep() {
      const medicines = document.getElementById('wizMeds').value.trim();
      const dosage = document.getElementById('wizDosage').value.trim();
      const doctorNotes = document.getElementById('wizNotes').value.trim();
      const date = document.getElementById('wizPrescDate').value;
      if (!medicines) return showToast('Medicines required', 'danger');
      try {
        const presc = await API.createPrescription({ patientId: wizardData.patientId, medicines, dosage, doctorNotes, date });
        wizardData.prescriptionId = presc.id;
        showToast('Prescription created', 'success');
        wizardCurrentStep++;
        renderWizardStep();
      } catch (err) { showToast('Failed: '+err.message, 'danger'); }
    }

    async function createBillingStep() {
      const amount = parseFloat(document.getElementById('wizAmount').value);
      const policyNumber = document.getElementById('wizPolicy').value.trim() || wizardData.policyNumber;
      if (isNaN(amount)) return showToast('Valid amount required', 'danger');
      try {
        const bill = await API.createBilling({ patientId: wizardData.patientId, amount, policyNumber });
        wizardData.billId = bill.id;
        showToast('Bill created', 'success');
        wizardCurrentStep++;
        renderWizardStep();
      } catch (err) { showToast('Failed: '+err.message, 'danger'); }
    }

    async function validateInsuranceStep() {
      try {
        const isValid = await API.validateInsurance(wizardData.policyNumber);
        document.getElementById('wizInsResult').innerHTML = `<div class="alert ${isValid?'alert-success':'alert-danger'}">Policy is ${isValid?'Valid':'Invalid'}</div>`;
        if (isValid) {
          showToast('Insurance valid', 'success');
          wizardCurrentStep++;
          setTimeout(() => renderWizardStep(), 500);
        } else {
          showToast('Insurance invalid', 'danger');
        }
      } catch (err) { showToast('Validation failed: '+err.message, 'danger'); }
    }

    async function payBillStep() {
      try {
        await API.payBill(wizardData.billId);
        showToast('Bill paid', 'success');
        document.getElementById('wizardInner').innerHTML = `
          <div class="text-center py-4">
            <i class="bi bi-check-circle text-success" style="font-size:3rem;"></i>
            <h4 class="mt-2">Appointment Completed!</h4>
            <p>All steps finished successfully.</p>
            <button class="btn btn-primary-custom" onclick="finishWizard()">Done</button>
          </div>
        `;
      } catch (err) { showToast('Payment failed: '+err.message, 'danger'); }
    }

    function finishWizard() {
      bootstrap.Modal.getInstance(document.getElementById('wizardModal')).hide();
      navigate('dashboard');
    }

    // ============================
    // Initialization
    // ============================
    document.addEventListener('DOMContentLoaded', function() {
      const loggedIn = localStorage.getItem('medicare_loggedIn') === 'true';
      if (!loggedIn) {
        const loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
        loginModal.show();
      } else {
        navigate('dashboard');
      }
      // Create wizard modal if not exists
      if (!document.getElementById('wizardModal')) {
        const modalHtml = `
          <div class="modal fade" id="wizardModal" tabindex="-1">
            <div class="modal-dialog modal-lg modal-dialog-centered">
              <div class="modal-content p-3">
                <div id="wizardInner"></div>
              </div>
            </div>
          </div>`;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
      }
    });
  </script>
</body>
</html>
